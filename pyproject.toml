[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lipay-sdk"
version = "1.0.0"
description = "Official Python SDK for the Lipay messaging platform — Customer Service Window (CSW) session guard"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Lipay", email = "dev@lipay.store" }]
keywords = ["lipay", "whatsapp", "messaging", "africa", "csm", "customer-service-window"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.115.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.urls]
Homepage = "https://github.com/Evans-musamia/LipayMessagingPlatform"
Documentation = "https://github.com/Evans-musamia/LipayMessagingPlatform#readme"
Repository = "https://github.com/Evans-musamia/LipayMessagingPlatform"

[tool.setuptools.packages.find]
include = ["lipay_sdk*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
